{% extends "base.html" %}
{% block title %}Registrarse - Mi portfolio{% endblock %}
{% block content %}
  <main class="container blog-container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <section class="card-descripcion">
          <h2>Crear cuenta</h2>
          <form method="post" class="form-blog">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="cv-button">Registrarme</button>
          </form>
          <p class="texto-card">¿Ya tenés cuenta? <a href="{% url 'login' %}">Ingresá</a></p>
        </section>
      </div>
    </div>
  </main>
{% endblock %}
