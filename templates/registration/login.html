{% extends "base.html" %}
{% block title %}Ingresar - Mi portfolio{% endblock %}
{% block content %}
  <main class="container blog-container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <section class="card-descripcion">
          <h2>Ingresar</h2>
          {% if form.errors %}
            <p class="error-form">Usuario o contraseña incorrectos.</p>
          {% endif %}
          <form method="post" class="form-blog">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="cv-button">Ingresar</button>
          </form>
          <p class="texto-card">¿No tenés cuenta? <a href="{% url 'signup' %}">Registrate</a></p>
        </section>
      </div>
    </div>
  </main>
{% endblock %}
